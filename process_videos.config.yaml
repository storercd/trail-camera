# Folder containing videos
input_dir: input

# Folder to receive sorted videos
output_dir: output

# SQLite catalog path (relative paths resolve under output_dir)
metadata_db_path: metadata/catalog.sqlite3

# Logical pipeline version written to metadata for reprocessing decisions
pipeline_version: 0.1.0

# MegaDetector model identifier or .pt path (default: MDV5A)
model: MDV5A

# Process every Nth frame (default: 5)
frame_sample: 5

# Detection confidence threshold for classifying a video as interesting (default: 0.7)
interesting_threshold: 0.7

# Category IDs considered interesting. MD default labels are 1=animal, 2=person, 3=vehicle.
interesting_categories:
  - "1"
  - "2"
  - "3"

# MegaDetector category IDs to force as uninteresting even if listed in interesting_categories.
excluded_megadetector_categories:
  - "2"
  - "3"

# Species labels to force as uninteresting when SpeciesNet top label matches.
uninteresting_species_labels:
  - blank
  - eastern gray squirrel
  - western gray squirrel
  - domestic dog
  - canis species

# Move files instead of copying them into output buckets

# Generic SpeciesNet labels to skip when choosing the displayed/stored primary species.
generic_species_labels_to_skip:
  - bird
move_files: false

# Save uninteresting videos in output/uninteresting; set false to keep only interesting videos
save_uninteresting_files: false

# Clip interesting videos to [first,last] interesting frames, buffered by frame_sample
clip_interesting_videos: true

# Recursively scan input directory for videos
recursive: false

# Enable verbose MegaDetector output while processing
detector_verbose: false

# Generate summary.html report file
generate_html_report: true

# Open summary.html automatically in the default browser/app after generation
auto_open_html_report: true

# Write compatibility JSON exports from SQLite snapshots
write_json_exports: true

# Output folder for extracted top-frame preview images (relative to current run output)
preview_output_dir: preview_frames

# Include uninteresting bucket entries when extracting previews
preview_include_uninteresting: false

# SpeciesNet model identifier; leave empty to use SpeciesNet default
speciesnet_model: ""

# Apply SpeciesNet geofence filtering during classification
speciesnet_geofence: false

# Add top species label and score to preview image filenames
speciesnet_label_in_filename: true

# Output folder for saved species classification crops (relative to run output)
species_crop_output_dir: preview_species_crops

# Normalized padding around bbox when generating species crops
species_crop_padding: 0.15

# Capture-date strategy: filesystem or camera_overlay
capture_date_source: camera_overlay

# Camera overlay OCR profile for timestamp extraction.
# roi is normalized [x0, y0, x1, y1] and tuned for this camera's bottom-left timestamp.
camera_date_profile:
  roi: [0.0, 0.66, 0.62, 1.0]
  date_regex: '(\d{2})-(\d{2})-(\d{4})'
  date_order: mdy
  sample_frames: 5
  ocr_psm: 6
