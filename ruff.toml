line-length = 120

# Set output format to concise (one line per error)
output-format = "concise"

[lint]
preview = true # 20251107: whitespace errors are still in preview at this time
# Select rules similar to flake8's default set
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "DOC",  # pydoclint
    "D",    # pydocstyle
    "ISC",  # flake8-implicit-str-concat
    "C90",  # McCabe complexity
    "PTH",  # use pathlib over os/pathlib legacy patterns
]
extend-ignore = ["PTH116", "PTH118", "PTH122", "PTH207", "PTH208"]
ignore = [
    "D205",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the first line
    "D401",  # First line of docstring should be in imperative mood
    "D203",  # 1 blank line required before class docstring
]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["DOC"]
